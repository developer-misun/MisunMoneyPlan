<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeScreen Layout Mockup</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .phone { width: 360px; background: white; border: 8px solid #333; border-radius: 36px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .top-bar { background: #6750A4; color: white; padding: 16px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .content { padding: 16px; }
        .card { background: #EADDFF; border-radius: 12px; padding: 20px; margin-bottom: 16px; text-align: center; }
        .tabs { display: flex; border-bottom: 1px solid #ddd; margin-bottom: 16px; }
        .tab { flex: 1; padding: 8px; text-align: center; color: #666; font-size: 14px; }
        .tab.active { color: #6750A4; border-bottom: 2px solid #6750A4; font-weight: bold; }
        .chart-placeholder { width: 100%; height: 180px; background: #f9f9f9; border: 1px dashed #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #999; margin-bottom: 24px; }

        /* 제안된 섹션 */
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .list-title { font-weight: bold; font-size: 16px; color: #1c1b1f; }
        .sort-button { background: #f0f0f0; border-radius: 20px; padding: 4px 12px; display: flex; align-items: center; cursor: pointer; border: 1px solid #ccc; font-size: 13px; }
        .sort-icon { margin-left: 4px; font-weight: bold; }

        .list-item { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .item-name { font-weight: 500; }
        .item-amount { color: #6750A4; font-weight: bold; }
    </style>
</head>
<body>
    <div class="phone">
        <div class="top-bar">
            <span>자산 관리</span>
            <span>📊</span>
        </div>
        <div class="content">
            <div class="card">
                <div style="font-size: 12px; color: #49454f;">총 자산</div>
                <div style="font-size: 24px; font-weight: bold; margin-top: 4px;">₩ 15,300,000</div>
            </div>

            <div class="tabs">
                <div class="tab active">종목별</div>
                <div class="tab">유형별</div>
                <div class="tab">지역별</div>
            </div>

            <div class="chart-placeholder">
                [ 트리맵 차트 영역 ]
            </div>

            <!-- 제안된 정렬 버튼 레이아웃 -->
            <div class="list-header">
                <div class="list-title">상위 자산 목록 <span style="font-size: 12px; color: #666; font-weight: normal;">(10개)</span></div>
                <div class="sort-button">
                    <span>금액순</span>
                    <span class="sort-icon">↓</span> <!-- 내림차순 상태 표시 -->
                </div>
            </div>

            <div class="list-item">
                <span class="item-name">삼성전자</span>
                <span class="item-amount">5,000,000</span>
            </div>
            <div class="list-item">
                <span class="item-name">비트코인</span>
                <span class="item-amount">3,000,000</span>
            </div>
        </div>
    </div>
</body>
</html>
